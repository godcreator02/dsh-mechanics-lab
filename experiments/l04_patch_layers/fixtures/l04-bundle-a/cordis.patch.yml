# L4 教学组合包自己的层——`dsh.bundle.patch` 指向的就是这份文件。
# 三条互不相干的标记条目，各自服务不同用例：
#   from-bundle  只用来证明「bundle 层贡献的条目认得出来」
#   shared       用来测「同一个 id 在四层各出现一次，谁胜出」
#   order-test   用来测「--patch 多个时按 argv 顺序」
- insert:
    - id: from-bundle
      name: l04-bundle-a
      config:
        layer: bundle

    - id: shared
      name: l04-bundle-a
      config:
        layer: bundle
        seq: 1

    - id: order-test
      name: l04-bundle-a
      config:
        which: base
