# 包自己那份 patch 文件（bundle 层）。
#
# 这个包一旦进了某个 profile 的 `dsh.profile.bundles` 名单，下面这个条目就自己
# 上树 —— 不用谁去活层手写 insert。这是 publish.md 描述的分发形态：作者把
# 「我贡献哪些条目」写在包里，用户那边只需要把包名加进名单。
#
# ⚠️ 只在包名进了名单时才生效。没进名单的话这个包就是一个普通依赖，这份文件
# 没人读 —— 本项其余几条用例走的正是那条路（条目由用例写在活层）。
#
# id 跟活层那几条用例保持一致，读事件流的那套代码两种形态通用。
- insert:
    - id: greeter
      name: hmr-linked
      config:
        版本: 配置第一版
