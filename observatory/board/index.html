<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>观测台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --paper:        #f7f8fa;
  --raised:       #ffffff;
  --sunk:         #eceff3;
  --ink:          #10161d;
  --ink-soft:     #3d4753;
  --ink-mute:     #6b7684;
  --rule:         #d8dee6;
  --rule-strong:  #b9c2cd;
  --accent:       #0e7c86;
  --accent-soft:  #d7eef0;

  --s-active:     #16a34a;
  --s-pending:    #b45309;
  --s-loading:    #1e4fa3;
  --s-unloading:  #1e4fa3;
  --s-failed:     #c2410c;
  --s-disposed:   #6b7684;
  --s-none:       #8892a0;

  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", ui-monospace, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1218; --raised: #141b23; --sunk: #090d12;
    --ink: #e6ebf1; --ink-soft: #b3bdc9; --ink-mute: #7d8794;
    --rule: #232d38; --rule-strong: #35414f;
    --accent: #3fb3bd; --accent-soft: #10333a;
    --s-active: #22c55e; --s-pending: #f0803f; --s-loading: #6a9beb;
    --s-unloading: #6a9beb; --s-failed: #f0803f; --s-disposed: #7d8794; --s-none: #7d8794;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 13px; line-height: 1.6;
  height: 100vh; display: flex; flex-direction: column;
}

/* ── 顶栏 ── */
header {
  flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--raised);
}
h1 { font-size: 13px; font-weight: 650; margin: 0; letter-spacing: .02em; }
h1 span { color: var(--accent); font-family: var(--mono); font-weight: 400; font-size: 11px; }
.spacer { flex: 1; }
select, button {
  font: inherit; font-size: 12px; font-family: var(--mono);
  background: var(--sunk); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 4px; padding: 3px 8px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
.stat { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

/* ── 布局 ── */
main { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
section:last-child { border-right: none; }
.sec-head {
  flex: none; padding: 7px 14px; border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-mute); background: var(--sunk);
  display: flex; justify-content: space-between; gap: 8px;
}
.scroll { flex: 1; overflow-y: auto; padding: 8px; }

/* ── 当前态卡片 ── */
.card {
  display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: center;
  padding: 6px 9px; border: 1px solid var(--rule); border-left-width: 3px;
  border-radius: 5px; margin-bottom: 5px; background: var(--raised);
}
.card .nm { font-family: var(--mono); font-size: 11.5px; word-break: break-all; }
.card .id { color: var(--ink-mute); font-size: 10px; }
.card .st { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .05em; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── 时间线 ── */
table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
th {
  text-align: left; font-weight: 500; font-size: 10px; letter-spacing: .08em;
  color: var(--ink-mute); text-transform: uppercase;
  padding: 4px 8px; border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; background: var(--paper);
}
td { padding: 2px 8px; border-bottom: 1px solid transparent; vertical-align: top; }
tbody tr:hover { background: var(--sunk); }
td.t { text-align: right; color: var(--ink-mute); font-variant-numeric: tabular-nums; white-space: nowrap; }
td.gap { color: var(--ink-mute); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 10px; }
td.nm { word-break: break-all; }
td.ev { white-space: nowrap; font-weight: 600; }
tr.own td.nm { color: var(--accent); }
tr.marker td { color: var(--ink-mute); font-style: italic; border-top: 1px dashed var(--rule-strong); }

/* ── 见证流 ── */
.wit { border: 1px solid var(--rule); border-radius: 5px; margin-bottom: 7px; background: var(--raised); overflow: hidden; }
.wit-h {
  padding: 5px 9px; background: var(--sunk); font-family: var(--mono); font-size: 10.5px;
  display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--rule);
}
.wit pre { margin: 0; padding: 7px 9px; font-family: var(--mono); font-size: 11px; line-height: 1.5; overflow-x: auto; }
.empty { color: var(--ink-mute); padding: 14px; text-align: center; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>观测台 <span id="run-label">—</span></h1>
  <select id="run-select" title="选一份运行记录"></select>
  <label class="chk"><input type="checkbox" id="only-lab" checked> 只看 lab-*</label>
  <label class="chk"><input type="checkbox" id="auto" checked> 自动刷新</label>
  <button id="refresh" type="button">刷新</button>
  <span class="spacer"></span>
  <span class="stat" id="stat">—</span>
</header>

<main>
  <section>
    <div class="sec-head"><span>当前态</span><span id="cnt-state"></span></div>
    <div class="scroll" id="state-list"></div>
    <div class="sec-head" style="border-top:1px solid var(--rule)"><span>见证流</span><span id="cnt-wit"></span></div>
    <div class="scroll" id="wit-list" style="max-height:38%"></div>
  </section>
  <section>
    <div class="sec-head"><span>事件时间线</span><span id="cnt-ev"></span></div>
    <div class="scroll" id="timeline"></div>
  </section>
</main>

<script>
"use strict";

const $ = (s) => document.querySelector(s);
const STATE_COLOR = {
  ACTIVE: "var(--s-active)", PENDING: "var(--s-pending)", LOADING: "var(--s-loading)",
  UNLOADING: "var(--s-unloading)", FAILED: "var(--s-failed)", DISPOSED: "var(--s-disposed)",
};
const colorOf = (s) => STATE_COLOR[s] || "var(--s-none)";

let currentRun = null;
let events = [];
let witnesses = [];

async function api(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function loadRuns() {
  const { runs } = await api("/api/runs");
  const sel = $("#run-select");
  const prev = currentRun;
  sel.innerHTML = "";
  if (runs.length === 0) {
    sel.innerHTML = '<option value="">（还没有运行记录）</option>';
    return;
  }
  // 事件日志最新的排前面
  runs.sort((a, b) => (b.eventMtime || 0) - (a.eventMtime || 0));
  for (const r of runs) {
    const opt = document.createElement("option");
    opt.value = r.label;
    opt.textContent = r.label + (r.hasEvents ? "  ·  " + Math.round(r.eventBytes / 1024) + "KB" : "  ·  无事件")
      + (r.witnessCount ? "  ·  见证 " + r.witnessCount : "");
    sel.appendChild(opt);
  }
  currentRun = runs.some((r) => r.label === prev) ? prev : runs[0].label;
  sel.value = currentRun;
}

async function loadRun() {
  if (!currentRun) return;
  $("#run-label").textContent = currentRun;
  const [ev, wt] = await Promise.all([
    api("/api/events?run=" + encodeURIComponent(currentRun)),
    api("/api/witness?run=" + encodeURIComponent(currentRun)),
  ]);
  events = ev.events || [];
  witnesses = wt.witnesses || [];
  render();
}

/** 只看 lab-* 时，滤掉框架自带条目——但那些条目本身是 L4 的教材，所以可切换。 */
function visible(e) {
  if (!$("#only-lab").checked) return true;
  const n = e.name || "";
  return n.startsWith("lab-");
}

/** 从事件流推导每个条目的当前状态。看板不连实例，实例死了也能看。 */
function deriveState() {
  const map = new Map();
  for (const e of events) {
    if (e.scope !== "entry" || !e.id) continue;
    const prev = map.get(e.id) || { id: e.id, name: e.name };
    if (e.kind === "snapshot") {
      map.set(e.id, { ...prev, name: e.name || prev.name, state: e.to, disabled: e.disabled, hasFiber: e.hasFiber });
    } else if (e.kind === "status") {
      map.set(e.id, { ...prev, name: e.name || prev.name, state: e.to, hasFiber: true });
    } else if (e.kind === "plugin") {
      map.set(e.id, { ...prev, name: e.name || prev.name });
    }
  }
  return [...map.values()].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
}

function render() {
  // ── 当前态 ──
  const all = deriveState();
  const shown = all.filter(visible);
  $("#state-list").innerHTML = shown.length === 0
    ? '<div class="empty">没有匹配的条目</div>'
    : shown.map((s) => {
        const label = s.state || (s.disabled ? "DISABLED" : "——");
        const color = s.state ? colorOf(s.state) : (s.disabled ? "var(--s-disposed)" : "var(--s-none)");
        return '<div class="card" style="border-left-color:' + color + '">'
          + '<span class="dot" style="background:' + color + '"></span>'
          + '<span><span class="nm">' + esc(s.name || s.id) + "</span>"
          + (s.id !== s.name ? '<br><span class="id">id: ' + esc(s.id) + "</span>" : "")
          + "</span>"
          + '<span class="st" style="color:' + color + '">' + esc(label) + "</span></div>";
      }).join("");
  $("#cnt-state").textContent = shown.length + " / " + all.length;

  // ── 时间线 ──
  const rows = events.filter((e) => e.kind === "recorder" || visible(e));
  const lastByEntry = new Map();
  const body = rows.map((e) => {
    if (e.kind === "recorder") {
      return '<tr class="marker"><td class="t">+' + e.ms.toFixed(3) + "</td><td></td>"
        + '<td colspan="2">' + esc(e.note || "") + "</td></tr>";
    }
    // 与该条目上一条事件的间隔——窄窗口就是在这一列现形的
    const prevMs = lastByEntry.get(e.id);
    lastByEntry.set(e.id, e.ms);
    const gap = prevMs === undefined ? "" : "+" + (e.ms - prevMs).toFixed(3);

    let desc, color;
    if (e.kind === "status") {
      desc = e.from + " → " + e.to;
      color = colorOf(e.to);
    } else if (e.kind === "snapshot") {
      desc = "snapshot " + (e.to || (e.disabled ? "DISABLED" : "无 fiber"));
      color = e.to ? colorOf(e.to) : "var(--s-none)";
    } else {
      desc = e.uid === null ? "fiber disposed" : "fiber created";
      color = "var(--ink-mute)";
    }
    const own = (e.name || "").startsWith("lab-") ? " class=\"own\"" : "";
    return "<tr" + own + '><td class="t">+' + e.ms.toFixed(3) + '</td><td class="gap">' + gap + "</td>"
      + '<td class="nm">' + esc(e.name || e.id || "—") + "</td>"
      + '<td class="ev" style="color:' + color + '">' + esc(desc) + "</td></tr>";
  }).join("");

  $("#timeline").innerHTML = rows.length === 0
    ? '<div class="empty">没有事件——这次运行可能没挂 lab-recorder</div>'
    : '<table><thead><tr><th style="text-align:right">+MS</th><th style="text-align:right">间隔</th>'
      + "<th>条目</th><th>事件</th></tr></thead><tbody>" + body + "</tbody></table>";
  $("#cnt-ev").textContent = rows.length + " / " + events.length;

  // ── 见证流 ──
  $("#wit-list").innerHTML = witnesses.length === 0
    ? '<div class="empty">没有见证文件</div>'
    : witnesses.map((w) =>
        '<div class="wit"><div class="wit-h"><span>' + esc(w.name) + "</span>"
        + "<span>" + new Date(w.mtime * 1000).toLocaleTimeString("zh-CN") + "</span></div>"
        + "<pre>" + esc(JSON.stringify(w.body, null, 2)) + "</pre></div>"
      ).join("");
  $("#cnt-wit").textContent = String(witnesses.length);

  const statuses = events.filter((e) => e.kind === "status").length;
  $("#stat").textContent = events.length + " 事件 · " + statuses + " 次状态转换 · " + all.length + " 个条目";
}

function esc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function tick() {
  try {
    await loadRuns();
    await loadRun();
  } catch (err) {
    $("#stat").textContent = "读取失败：" + err.message;
  }
}

$("#run-select").addEventListener("change", (e) => { currentRun = e.target.value; loadRun(); });
$("#only-lab").addEventListener("change", render);
$("#refresh").addEventListener("click", tick);
setInterval(() => { if ($("#auto").checked) tick(); }, 2000);
tick();
</script>
</body>
</html>
